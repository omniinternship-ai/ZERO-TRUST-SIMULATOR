<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#cc0066"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b050"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#1a2b4c" stroke-width="2"/>
  
  <!-- Left Tube -->
  <g transform="translate(24, 20)">
    <path d="M6 10 L6 70 A14 14 0 0 0 34 70 L34 10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 10 L38 10" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
    <!-- Liquid layers -->
    <path d="M8 70 A12 12 0 0 0 32 70 L32 58 L8 58 Z" fill="url(#cyan)"/>
    <rect x="8" y="44" width="24" height="13" fill="url(#cyan)"/>
    <rect x="8" y="30" width="24" height="13" fill="url(#cyan)"/>
    <rect x="8" y="16" width="24" height="13" fill="url(#cyan)" filter="url(#glow)"/>
    <!-- Highlight -->
    <line x1="11" y1="18" x2="11" y2="70" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>

  <!-- Right Tube -->
  <g transform="translate(64, 20)">
    <path d="M6 10 L6 70 A14 14 0 0 0 34 70 L34 10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 10 L38 10" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
    <!-- Liquid layers mixed -->
    <path d="M8 70 A12 12 0 0 0 32 70 L32 58 L8 58 Z" fill="url(#green)"/>
    <rect x="8" y="44" width="24" height="13" fill="url(#pink)"/>
    <rect x="8" y="30" width="24" height="13" fill="url(#pink)"/>
    <!-- Highlight -->
    <line x1="11" y1="32" x2="11" y2="70" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  </g>

  <!-- Droplet pouring -->
  <circle cx="58" cy="36" r="3.5" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="53" cy="46" r="2.5" fill="#00d4ff"/>
</svg>
